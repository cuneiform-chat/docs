name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs the full pipeline via package.json hooks:
      #   prebuild  -> scripts/fill-missing-translations.mjs
      #   build     -> next build (static export to ./out)
      #   postbuild -> pagefind (site + one leg per ACTIVE locale)
      #                next-sitemap
      #                scripts/generate-legacy-redirects.mjs
      # Do NOT re-declare those steps here. This workflow used to duplicate the
      # pagefind + next-sitemap legs "for safety", which made it an untracked
      # extra copy of the locale list; it drifted (kept the disabled `ru`,
      # missed the active `bn`) and pagefind hard-failed on the unbuilt out/ru
      # directory, breaking the deploy. package.json's postbuild is the single
      # source of truth for the per-locale legs.
      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
