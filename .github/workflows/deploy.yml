name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fill missing translations
        run: node scripts/fill-missing-translations.mjs

      - name: Build
        run: npm run build

      # Note: pagefind + next-sitemap already run via package.json `postbuild`
      # hook during `npm run build` above. The separate steps below are kept
      # idempotent for safety but must not reference disabled locales.
      # Active locales: en, es, pt, fr. Disabled: bn, hi, ru, th. See
      # .claude/references/features/admin-panel-i18n.md.
      - name: Generate search indexes (redundant with postbuild, kept for safety)
        run: |
          npx pagefind --site out --output-path out/_pagefind
          npx pagefind --site out/en --output-path out/en/_pagefind
          npx pagefind --site out/es --output-path out/es/_pagefind
          npx pagefind --site out/pt --output-path out/pt/_pagefind
          npx pagefind --site out/fr --output-path out/fr/_pagefind

      - name: Generate sitemap
        run: npx next-sitemap

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
